services:
  novabot:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/novabot:latest
    pull_policy: build
    container_name: novabot
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    devices:
      - "/dev/snd:/dev/snd"
    volumes:
      - ./hey_nova.onnx:/opt/oww-models/hey_nova.onnx:ro
      - /sys/class/hwmon:/sys/class/hwmon:ro
      - /run/user/1000/pulse:/run/user/1000/pulse
    environment:
      - HTTP_PORT=8080
      - UDP_AUDIO_PORT=4000
      - WAKE_WORD=nova
      - DETECTOR_TYPE=openwakeword
      - WAKE_MODEL_FILE=hey_nova.onnx
      - MIC_DEVICE=pulse
      - SPEAKER_DEVICE=pulse
      - AUDIO_QUALITY=standard
      - OMP_NUM_THREADS=1
      - WAKE_SILENCE_RMS=400
      - WAKE_SILENCE_FRAMES=25
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
      - XDG_RUNTIME_DIR=/run/user/1000
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"