version: '3.8'

services:
  novabot:
    build: .
    container_name: novabot
    restart: unless-stopped
    network_mode: host
    devices:
      - "/dev/snd:/dev/snd"
    volumes:
      # bind-mount the wake model so you can swap it without rebuilding
      - ./hey_nova.onnx:/opt/oww-models/hey_nova.onnx:ro
      # lm-sensors host data for temperature readings
      - /sys/class/hwmon:/sys/class/hwmon:ro
    environment:
      - HTTP_PORT=8080
      - UDP_AUDIO_PORT=4000
      - WAKE_WORD=nova
      - DETECTOR_TYPE=openwakeword
      - WAKE_MODEL_FILE=hey_nova.onnx
      - MIC_DEVICE=pulse
      - SPEAKER_DEVICE=pulse
      - OMP_NUM_THREADS=1
      - WAKE_SILENCE_RMS=400
      - WAKE_SILENCE_FRAMES=25
      - AUDIO_QUALITY=standard
    mem_limit: 512m